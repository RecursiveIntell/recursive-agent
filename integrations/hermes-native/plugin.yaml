name: recursive-agent-native
version: 1.0.0
description: "Translate one bounded recursive-agent action over authenticated native IPC. No MCP, no Hermes core edits. Submits a fixed native V1 operation to a local recursive-agent daemon and returns daemon-derived terminal status plus strict verification facts; the plugin owns no evidence."
author: RecursiveIntell
kind: standalone
provides_tools:
  - recursive_agent_execute
config_schema:
  terminal_timeout_seconds:
    type: number
    default: 10
    description: "Bounded terminal-report/closure RPC deadline (0 < seconds <= 60); pre-send admission remains 2 seconds."
  socket_path:
    type: string
    description: "Absolute private Unix socket shared with the per-home native daemon."
  governance_mode:
    type: string
    default: "off"
    enum: ["off", observe, enforce]
    description: "off registers no governor; observe records unwitnessed failures without blocking; enforce requires physical-send admission."

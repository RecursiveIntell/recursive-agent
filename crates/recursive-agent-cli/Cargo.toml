[package]
name = "recursive-agent-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "M0 CLI: ra run, ra verify, ra replay, ra doctor"

[[bin]]
name = "ra"
path = "src/main.rs"

[dependencies]
recursive-agent-contracts = { path = "../recursive-agent-contracts" }
recursive-agent-ledger = { path = "../recursive-agent-ledger" }
recursive-agent-runner = { path = "../recursive-agent-runner" }
recursive-agent-daemon = { path = "../recursive-agent-daemon" }
recursive-agent-policy = { path = "../recursive-agent-policy" }
recursive-agent-sandbox = { path = "../recursive-agent-sandbox" }
recursive-agent-tools = { path = "../recursive-agent-tools" }
recursive-agent-provider = { path = "../recursive-agent-provider" }
recursive-agent-memory = { path = "../recursive-agent-memory" }
llm-tool-runtime = { workspace = true }
async-trait = "0.1"
tokio = { version = "1", features = ["rt"] }
nix = { version = "0.30.1", features = ["socket"] }
rustix = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

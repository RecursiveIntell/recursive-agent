name: portable-lockfile-once

on:
  push:
    branches:
      - fix/portable-normal-chat-replay-20260910

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate lockfile from canonical pinned dependency graph
        run: cargo generate-lockfile
      - name: Verify metadata resolves without sibling Libraries checkout
        run: cargo metadata --locked --format-version 1 > /tmp/metadata.json
      - name: Reject host-local Libraries paths and mixed revisions
        shell: python
        run: |
          import json
          import tomllib
          from pathlib import Path

          expected = '13d485f0ea16c8cf69033fc7622088305e7f184f'
          expected_url = 'https://github.com/RecursiveIntell/Libraries.git'
          target = {
              'boundary-compiler', 'stack-ids', 'bitemporal-runtime',
              'claim-ledger', 'llm-tool-runtime'
          }

          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          declared = manifest['workspace']['dependencies']
          for name in target:
              item = declared.get(name)
              if not isinstance(item, dict):
                  raise SystemExit(f'missing Libraries workspace dependency: {name}')
              if item.get('git') != expected_url or item.get('rev') != expected or 'path' in item:
                  raise SystemExit(f'noncanonical Libraries dependency declaration: {name}: {item!r}')

          data = json.loads(Path('/tmp/metadata.json').read_text())
          found = [p for p in data['packages'] if p['name'] in target]
          if not found:
              raise SystemExit('no Libraries package participates in resolved graph')
          for package in found:
              source = package.get('source')
              if not source or not source.startswith(f'git+{expected_url}?rev=') or expected not in source:
                  raise SystemExit(f'unexpected Libraries source for {package["name"]}: {source!r}')

          forbidden = '/home/sikmindz/Coding/Libraries/'
          if forbidden in Path('Cargo.toml').read_text() or forbidden in Path('Cargo.lock').read_text():
              raise SystemExit('host-local Libraries path remains in canonical Cargo inputs')
          print(f'verified {len(found)} resolved Libraries packages at {expected}')
      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the pinned graph"
            exit 0
          fi
          git config user.name "recursive-agent lockfile bot"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: regenerate lockfile for canonical Libraries pin"
          git push origin HEAD:fix/portable-normal-chat-replay-20260910
      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: recursive-agent-portable-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

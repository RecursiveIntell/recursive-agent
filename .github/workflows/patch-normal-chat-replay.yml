name: patch-normal-chat-replay

on:
  push:
    branches:
      - fix/portable-replay-20260910
    paths:
      - .github/workflows/patch-normal-chat-replay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portable-replay-20260910
          fetch-depth: 0
      - name: Apply exact replay patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact patch anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          policy = "crates/recursive-agent-policy/src/lib.rs"
          marker = '''    /// Consume only after current normal-chat policy and exact call checks.\n'''
          insert = '''    /// Read back the exact native outcome persisted for one normal-chat permit.\n    /// This is observation-only: it neither renews nor reissues authority.\n    pub fn normal_chat_outcome(\n        &self,\n        permit_id: &CurrentPermitId,\n    ) -> Result<PermitOutcomeReceiptV1, PolicyError> {\n        self.with_lock(|| {\n            let record = self.read_record_or_reject(permit_id)?;\n            if record.permit.binding.tool != NORMAL_CHAT_LANE {\n                return Err(PolicyError::InvalidLease("not a normal-chat permit".into()));\n            }\n            let preflight = record\n                .preflight_receipt\n                .ok_or(PolicyError::PermitStateConflict)?;\n            preflight.validate()?;\n            let outcome = record\n                .outcome_receipt\n                .ok_or(PolicyError::PermitStateConflict)?;\n            outcome.validate()?;\n            if outcome.permit_id != *permit_id\n                || outcome.preflight_receipt_digest != preflight.receipt_digest\n            {\n                return Err(PolicyError::PermitStateConflict);\n            }\n            Ok(outcome)\n        })\n    }\n\n    /// Resolve the attempt identity already reserved for a durable normal-chat\n    /// permit. This reads the canonical attempt-family record; callers cannot\n    /// supply or widen the mapping during replay.\n    pub fn normal_chat_attempt_for_permit(\n        &self,\n        permit_id: &CurrentPermitId,\n    ) -> Result<NormalChatAttemptId, PolicyError> {\n        self.with_lock(|| {\n            let record = self.read_record_or_reject(permit_id)?;\n            if record.permit.binding.tool != NORMAL_CHAT_LANE {\n                return Err(PolicyError::InvalidLease("not a normal-chat permit".into()));\n            }\n            let parent = record\n                .permit\n                .binding\n                .parent_permit_id\n                .as_ref()\n                .ok_or(PolicyError::PermitStateConflict)?;\n            let state = self.read_normal_chat_family_state()?;\n            let family = state\n                .families\n                .get(&parent.to_string())\n                .ok_or(PolicyError::PermitStateConflict)?;\n            let mut found = None;\n            for reservation in family.attempts.values() {\n                if reservation.permit_id == *permit_id {\n                    if found.is_some() {\n                        return Err(PolicyError::PermitStateConflict);\n                    }\n                    found = Some(reservation.attempt_id.clone());\n                }\n            }\n            found.ok_or(PolicyError::PermitStateConflict)\n        })\n    }\n\n'''
          replace_once(policy, marker, insert + marker)

          normal = "crates/recursive-agent-runner/src/normal_chat.rs"
          replace_once(
              normal,
              '''use recursive_agent_contracts::{\n    content_digest, ArtifactDescriptorV1, CurrentPermitId, ToolCallSpecV1,\n};\n''',
              '''use recursive_agent_contracts::{\n    content_digest, ArtifactDescriptorV1, ContentDigest, CurrentPermitId, NormalChatAttemptId,\n    ToolCallSpecV1,\n};\n''',
          )
          replace_once(
              normal,
              '''use recursive_agent_policy::{\n    DurablePermitStore, NormalChatAdmissionVerifier, PermitOutcomeReceiptV1, PolicyError,\n    ReportedEffectOutcomeV1, ReportedEffectStateV1, ValidatedNormalChatAdmissionV1,\n};\nuse recursive_agent_provider::{CompletionBackend, ConversationRequestV1};\n''',
              '''use recursive_agent_policy::{\n    DurablePermitStore, NormalChatAdmissionVerifier, PermitOutcomeReceiptV1,\n    PermitPreflightReceiptV1, PolicyError, ReportedEffectOutcomeV1, ReportedEffectStateV1,\n    ValidatedNormalChatAdmissionV1,\n};\nuse recursive_agent_provider::{CompletionBackend, CompletionResponseV1, ConversationRequestV1};\n''',
          )
          replace_once(
              normal,
              '''    #[error("normal-chat encoding failed")]\n    Encoding,\n''',
              '''    #[error("normal-chat encoding failed")]\n    Encoding,\n    #[error("recorded normal-chat replay material is malformed or noncanonical")]\n    ReplayMalformed,\n    #[error("recorded normal-chat replay material does not bind durable execution evidence")]\n    ReplayBindingMismatch,\n    #[error("recorded normal-chat replay requires a durably reported successful outcome")]\n    ReplayOutcomeNotSucceeded,\n''',
          )
          replace_once(
              normal,
              '''#[derive(serde::Serialize)]\nenum RecordedNormalChatResponseSchemaV1 {\n''',
              '''#[derive(Debug, Clone, Copy, PartialEq, Eq, serde::Serialize, serde::Deserialize)]\nenum RecordedNormalChatResponseSchemaV1 {\n''',
          )
          response_marker = '''pub struct NativeNormalChatObservation {\n'''
          response_insert = '''#[derive(serde::Serialize, serde::Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct RecordedNormalChatResponseReplayV1 {\n    schema: RecordedNormalChatResponseSchemaV1,\n    attempt_id: NormalChatAttemptId,\n    permit_id: CurrentPermitId,\n    preflight_receipt_digest: ContentDigest,\n    response: CompletionResponseV1,\n}\n\n#[derive(serde::Serialize)]\nstruct RecordedNormalChatObservationV1<'a> {\n    schema: &'static str,\n    attempt: &'a NormalChatAttemptId,\n    response: &'a ArtifactDescriptorV1,\n    preflight: &'a PermitPreflightReceiptV1,\n    outcome: &'a PermitOutcomeReceiptV1,\n}\n\n#[derive(serde::Serialize, serde::Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct RecordedNormalChatObservationReplayV1 {\n    schema: String,\n    attempt: NormalChatAttemptId,\n    response: ArtifactDescriptorV1,\n    preflight: PermitPreflightReceiptV1,\n    outcome: PermitOutcomeReceiptV1,\n}\n\n'''
          replace_once(normal, response_marker, response_insert + response_marker)
          execute_marker = '''    pub fn execute(\n'''
          replay_method = '''    /// Replay one caller-selected recorded response without invoking the backend.\n    /// The observation descriptor must itself come from an external durable/\n    /// trusted evidence reference; this method verifies it but does not discover\n    /// replay authority from unanchored artifacts.\n    pub fn replay_recorded(\n        &self,\n        observation_artifact: &ArtifactDescriptorV1,\n    ) -> Result<CompletionResponseV1, NativeNormalChatError> {\n        let artifact_root = self.artifacts.run_root_identity();\n        if self.permits.run_root_identity() != (artifact_root.device, artifact_root.inode) {\n            return Err(NativeNormalChatError::StoreMismatch);\n        }\n        let observation_bytes = self.artifacts.get(observation_artifact)?;\n        let observation: RecordedNormalChatObservationReplayV1 =\n            serde_json::from_slice(&observation_bytes)\n                .map_err(|_| NativeNormalChatError::ReplayMalformed)?;\n        let canonical_observation = recursive_agent_contracts::jcs_canonical(&observation)\n            .map_err(|_| NativeNormalChatError::ReplayMalformed)?;\n        if canonical_observation != observation_bytes\n            || observation.schema != "recursive-agent.normal-chat-observation/v1"\n        {\n            return Err(NativeNormalChatError::ReplayMalformed);\n        }\n        observation.preflight.validate()?;\n        observation.outcome.validate()?;\n        if observation.preflight.permit_id != observation.outcome.permit_id\n            || observation.outcome.preflight_receipt_digest\n                != observation.preflight.receipt_digest\n        {\n            return Err(NativeNormalChatError::ReplayBindingMismatch);\n        }\n        let permit_id = &observation.outcome.permit_id;\n        let persisted_preflight = self.permits.normal_chat_preflight(permit_id)?;\n        let persisted_outcome = self.permits.normal_chat_outcome(permit_id)?;\n        let persisted_attempt = self.permits.normal_chat_attempt_for_permit(permit_id)?;\n        if persisted_preflight != observation.preflight\n            || persisted_outcome != observation.outcome\n            || persisted_attempt != observation.attempt\n        {\n            return Err(NativeNormalChatError::ReplayBindingMismatch);\n        }\n        if persisted_outcome.reported.state != ReportedEffectStateV1::Succeeded {\n            return Err(NativeNormalChatError::ReplayOutcomeNotSucceeded);\n        }\n        let response_bytes = self.artifacts.get(&observation.response)?;\n        let recorded: RecordedNormalChatResponseReplayV1 =\n            serde_json::from_slice(&response_bytes)\n                .map_err(|_| NativeNormalChatError::ReplayMalformed)?;\n        let canonical_response = recursive_agent_contracts::jcs_canonical(&recorded)\n            .map_err(|_| NativeNormalChatError::ReplayMalformed)?;\n        if canonical_response != response_bytes {\n            return Err(NativeNormalChatError::ReplayMalformed);\n        }\n        if recorded.schema != RecordedNormalChatResponseSchemaV1::V1\n            || recorded.attempt_id != observation.attempt\n            || recorded.permit_id != *permit_id\n            || recorded.preflight_receipt_digest != persisted_preflight.receipt_digest\n        {\n            return Err(NativeNormalChatError::ReplayBindingMismatch);\n        }\n        Ok(recorded.response)\n    }\n\n'''
          replace_once(normal, execute_marker, replay_method + execute_marker)
          replace_once(
              normal,
              '''        let observation = serde_json::json!({\n            "schema": "recursive-agent.normal-chat-observation/v1",\n            "attempt": attempt.attempt_id,\n            "response": response_artifact,\n            "preflight": preflight,\n            "outcome": outcome,\n        });\n        let encoded_observation =\n            serde_json::to_vec(&observation).map_err(|_| NativeNormalChatError::Encoding)?;\n''',
              '''        let observation = RecordedNormalChatObservationV1 {\n            schema: "recursive-agent.normal-chat-observation/v1",\n            attempt: &attempt.attempt_id,\n            response: &response_artifact,\n            preflight: &preflight,\n            outcome: &outcome,\n        };\n        let encoded_observation = recursive_agent_contracts::jcs_canonical(&observation)\n            .map_err(|_| NativeNormalChatError::Encoding)?;\n''',
          )

          test = "crates/recursive-agent-runner/tests/normal_chat_execution.rs"
          replace_once(
              test,
              '''    let observed = executor.execute(&permit.permit_id, &admission, &request);\n''',
              '''    let observed = executor.execute(&permit.permit_id, &admission, &request);\n    let mut replay_observation = None;\n''',
          )
          replace_once(
              test,
              '''    } else if mode == 0 {\n        let result = observed?;\n''',
              '''    } else if mode == 0 {\n        let result = observed?;\n        replay_observation = Some(result.observation_artifact.clone());\n''',
          )
          replace_once(
              test,
              '''                let withheld = serde_json::to_vec(&serde_json::json!({\n                    "schema": "recursive-agent.normal-chat-observation/v1",\n                    "attempt": admission.attempt().attempt_id,\n                    "response": response_artifact,\n                    "preflight": store.normal_chat_preflight(&permit.permit_id)?,\n                    "outcome": outcome,\n                }))?;\n''',
              '''                let withheld = recursive_agent_contracts::jcs_canonical(&serde_json::json!({\n                    "schema": "recursive-agent.normal-chat-observation/v1",\n                    "attempt": admission.attempt().attempt_id,\n                    "response": response_artifact,\n                    "preflight": store.normal_chat_preflight(&permit.permit_id)?,\n                    "outcome": outcome,\n                }))?;\n''',
          )
          replace_once(
              test,
              '''    let reopened = open_store(root.path())?;\n    let restarted = recursive_agent_runner::NativeNormalChatExecutor::new(\n        &reopened,\n        &artifacts,\n        &AllowCurrentEgress,\n        &TestClock,\n        &backend,\n    );\n''',
              '''    let reopened = open_store(root.path())?;\n    let reopened_root_fd = std::fs::File::open(root.path())?;\n    let reopened_artifacts =\n        recursive_agent_ledger::ArtifactStore::from_run_root_fd(&reopened_root_fd, false)?;\n    let restarted = recursive_agent_runner::NativeNormalChatExecutor::new(\n        &reopened,\n        &reopened_artifacts,\n        &AllowCurrentEgress,\n        &TestClock,\n        &backend,\n    );\n''',
          )
          tail = '''    assert_eq!(backend.0.load(std::sync::atomic::Ordering::SeqCst), 1);\n    Ok(())\n}\n'''
          tail_replacement = '''    assert_eq!(backend.0.load(std::sync::atomic::Ordering::SeqCst), 1);\n    if mode == 0 {\n        let observation = replay_observation.ok_or("missing replay observation")?;\n        let replayed = restarted.replay_recorded(&observation)?;\n        assert_eq!(replayed.text, "fixture response");\n        let replayed_again = restarted.replay_recorded(&observation)?;\n        assert_eq!(replayed_again, replayed);\n        assert_eq!(backend.0.load(std::sync::atomic::Ordering::SeqCst), 1);\n\n        let mut wrong_descriptor = observation.clone();\n        wrong_descriptor.byte_length = wrong_descriptor.byte_length.saturating_add(1);\n        assert!(restarted.replay_recorded(&wrong_descriptor).is_err());\n        assert_eq!(backend.0.load(std::sync::atomic::Ordering::SeqCst), 1);\n\n        let observation_bytes = reopened_artifacts.get(&observation)?;\n        let mut tampered_outcome: serde_json::Value = serde_json::from_slice(&observation_bytes)?;\n        tampered_outcome["outcome"]["reported"]["state"] = serde_json::json!("failed");\n        let tampered_outcome_bytes = recursive_agent_contracts::jcs_canonical(&tampered_outcome)?;\n        let tampered_outcome_artifact = reopened_artifacts.put(\n            &tampered_outcome_bytes,\n            "application/json",\n            None,\n        )?;\n        assert!(restarted.replay_recorded(&tampered_outcome_artifact).is_err());\n        assert_eq!(backend.0.load(std::sync::atomic::Ordering::SeqCst), 1);\n\n        let mut tampered_response: serde_json::Value = serde_json::from_slice(&observation_bytes)?;\n        let original_length = tampered_response["response"]["byte_length"]\n            .as_u64()\n            .ok_or("missing response byte length")?;\n        tampered_response["response"]["byte_length"] =\n            serde_json::json!(original_length.saturating_add(1));\n        let tampered_response_bytes = recursive_agent_contracts::jcs_canonical(&tampered_response)?;\n        let tampered_response_artifact = reopened_artifacts.put(\n            &tampered_response_bytes,\n            "application/json",\n            None,\n        )?;\n        assert!(restarted.replay_recorded(&tampered_response_artifact).is_err());\n        assert_eq!(backend.0.load(std::sync::atomic::Ordering::SeqCst), 1);\n    }\n    Ok(())\n}\n'''
          replace_once(test, tail, tail_replacement)
          PY
          git diff --check
          git diff -- crates/recursive-agent-policy/src/lib.rs crates/recursive-agent-runner/src/normal_chat.rs crates/recursive-agent-runner/tests/normal_chat_execution.rs
      - name: Commit replay implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/recursive-agent-policy/src/lib.rs \
                  crates/recursive-agent-runner/src/normal_chat.rs \
                  crates/recursive-agent-runner/tests/normal_chat_execution.rs
          git commit -m "feat(runtime): add verified recorded normal-chat replay"
          git push origin HEAD:fix/portable-replay-20260910

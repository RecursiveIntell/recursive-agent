name: format-replay-once

on:
  push:
    branches:
      - fix/portable-replay-20260910
    paths:
      - .github/workflows/format-replay-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portable-replay-20260910
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and constrain changed surface
        shell: bash
        run: |
          rustfmt --edition 2021 crates/recursive-agent-runner/src/normal_chat.rs
          rustfmt --edition 2021 crates/recursive-agent-runner/tests/normal_chat_execution.rs
          python3 - <<'PY'
          import subprocess
          allowed = {
              'crates/recursive-agent-runner/src/normal_chat.rs',
              'crates/recursive-agent-runner/tests/normal_chat_execution.rs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected rustfmt changes: {sorted(unexpected)}')
          if not changed:
              raise SystemExit('rustfmt produced no changes')
          PY
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/recursive-agent-runner/src/normal_chat.rs \
                  crates/recursive-agent-runner/tests/normal_chat_execution.rs
          git commit -m "style(runtime): format recorded replay implementation"
          git push origin HEAD:fix/portable-replay-20260910

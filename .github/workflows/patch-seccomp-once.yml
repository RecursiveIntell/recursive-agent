name: patch-seccomp-once

on:
  push:
    branches:
      - fix/portable-normal-chat-replay-20260910

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply bounded libseccomp 0.4 API repair
        run: python3 .ci/patch_seccomp_once.py
      - name: Format repaired source
        run: cargo fmt --all
      - name: Verify patch scope
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "crates/recursive-agent-runner/src/sandbox_engine.rs"
      - name: Compile runner against locked graph
        run: cargo check --locked -p recursive-agent-runner
      - name: Commit repair and remove temporary tooling
        run: |
          git config user.name "recursive-agent seccomp repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/recursive-agent-runner/src/sandbox_engine.rs
          git rm .ci/patch_seccomp_once.py .github/workflows/patch-seccomp-once.yml
          git commit -m "fix(sandbox): export seccomp BPF through supported fd API"
          git push origin HEAD:fix/portable-normal-chat-replay-20260910

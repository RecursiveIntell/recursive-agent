name: patch-seccomp-export-once

on:
  push:
    branches:
      - fix/portable-replay-20260910
    paths:
      - .github/workflows/patch-seccomp-export-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portable-replay-20260910
      - name: Apply bounded libseccomp 0.4 export repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/recursive-agent-runner/src/sandbox_engine.rs')
          text = p.read_text()
          old = (
              '    let bytes = filter\n'
              '        .export_bpf_mem()\n'
              '        .map_err(|error| SandboxError::Io(format!("seccomp export: {error}")))?;\n'
              '    let digest = recursive_agent_contracts::ContentDigest::compute(&bytes).to_string();\n'
              '    let mut file = tempfile::tempfile().map_err(|error| SandboxError::Io(error.to_string()))?;\n'
              '    file.write_all(&bytes)\n'
              '        .map_err(|error| SandboxError::Io(error.to_string()))?;\n'
              '    file.seek(std::io::SeekFrom::Start(0))\n'
              '        .map_err(|error| SandboxError::Io(error.to_string()))?;\n'
          )
          new = (
              '    // libseccomp-rs 0.4 exposes BPF export through an AsFd. Export the\n'
              '    // compiled filter directly into the same anonymous file that will be\n'
              '    // handed to the child, then read those exact bytes only to bind its digest.\n'
              '    let mut file = tempfile::tempfile().map_err(|error| SandboxError::Io(error.to_string()))?;\n'
              '    filter\n'
              '        .export_bpf(&file)\n'
              '        .map_err(|error| SandboxError::Io(format!("seccomp export: {error}")))?;\n'
              '    file.seek(std::io::SeekFrom::Start(0))\n'
              '        .map_err(|error| SandboxError::Io(error.to_string()))?;\n'
              '    let mut bytes = Vec::new();\n'
              '    file.read_to_end(&mut bytes)\n'
              '        .map_err(|error| SandboxError::Io(error.to_string()))?;\n'
              '    if bytes.is_empty() {\n'
              '        return Err(SandboxError::Io("seccomp export produced an empty BPF program".into()));\n'
              '    }\n'
              '    let digest = recursive_agent_contracts::ContentDigest::compute(&bytes).to_string();\n'
              '    file.seek(std::io::SeekFrom::Start(0))\n'
              '        .map_err(|error| SandboxError::Io(error.to_string()))?;\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one seccomp export anchor, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rustfmt --edition 2021 crates/recursive-agent-runner/src/sandbox_engine.rs
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "crates/recursive-agent-runner/src/sandbox_engine.rs"
      - name: Commit repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/recursive-agent-runner/src/sandbox_engine.rs
          git commit -m "fix(sandbox): export seccomp BPF through supported fd API"
          git push origin HEAD:fix/portable-replay-20260910

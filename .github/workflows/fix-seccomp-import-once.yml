name: fix-seccomp-import-once

on:
  push:
    branches:
      - fix/portable-normal-chat-replay-20260910

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove obsolete Write import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/recursive-agent-runner/src/sandbox_engine.rs')
          text = p.read_text()
          old = 'use std::io::{Read, Seek, Write};'
          new = 'use std::io::{Read, Seek};'
          if text.count(old) != 1:
              raise SystemExit('expected obsolete import exactly once')
          p.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          test "$(git diff --name-only)" = "crates/recursive-agent-runner/src/sandbox_engine.rs"
      - name: Verify runner clippy
        run: cargo clippy --locked -p recursive-agent-runner --all-targets -- -D warnings
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "recursive-agent clippy repair bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/recursive-agent-runner/src/sandbox_engine.rs
          git rm .github/workflows/fix-seccomp-import-once.yml
          git commit -m "fix(sandbox): remove obsolete seccomp write import"
          git push origin HEAD:fix/portable-normal-chat-replay-20260910

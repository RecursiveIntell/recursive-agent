[workspace]
resolver = "2"
members = [
    "crates/recursive-agent-contracts",
    "crates/recursive-agent-ledger",
    "crates/recursive-agent-policy",
    "crates/recursive-agent-provider",
    "crates/recursive-agent-sandbox",
    "crates/recursive-agent-tools",
    "crates/recursive-agent-runner",
    "crates/recursive-agent-cli",
    "crates/recursive-agent-mcp",
    "crates/recursive-agent-daemon",
    "crates/recursive-agent-memory",
    "crates/recursive-agent-skills",
    "crates/recursive-agent-mcts",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
authors = ["RecursiveIntell"]
publish = false

[workspace.dependencies]
# External RecursiveIntell owners resolve from one immutable canonical Libraries
# revision. Local coordinated development may use an explicit uncommitted Cargo
# patch, but canonical source never falls back to a workstation path.
boundary-compiler = { version = "0.1.0", git = "https://github.com/RecursiveIntell/Libraries.git", rev = "13d485f0ea16c8cf69033fc7622088305e7f184f" }
stack-ids = { version = "0.1.1", git = "https://github.com/RecursiveIntell/Libraries.git", rev = "13d485f0ea16c8cf69033fc7622088305e7f184f" }
bitemporal-runtime = { version = "0.1.0", git = "https://github.com/RecursiveIntell/Libraries.git", rev = "13d485f0ea16c8cf69033fc7622088305e7f184f", default-features = false }
claim-ledger = { version = "0.1.0", git = "https://github.com/RecursiveIntell/Libraries.git", rev = "13d485f0ea16c8cf69033fc7622088305e7f184f" }
llm-tool-runtime = { version = "0.1.0", git = "https://github.com/RecursiveIntell/Libraries.git", rev = "13d485f0ea16c8cf69033fc7622088305e7f184f" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.44", features = ["serde"] }
thiserror = "2.0.18"
clap = { version = "4.5", features = ["derive"] }
blake3 = "1.8.3"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
sha2 = "0.10"
hex = "0.4"
rustix = { version = "=1.1.4", features = ["fs"] }
url = "=2.5.8"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

# Clippy lints. The `deny` group is enforced as a hard error in every target.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
